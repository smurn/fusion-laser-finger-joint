name: Build

# Builds the add-in packages on every push and pull request.
# Pushing a tag like v1.2.3 also creates a GitHub release with the packages attached.
# The tag must match the version in "Laser Finger Joint.manifest".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax
        run: python -m compileall -q "Laser Finger Joint.py" laser_finger_joint_feature.py sane tools

      - name: Build packages
        run: python tools/build.py

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import json; print(json.load(open('Laser Finger Joint.manifest', encoding='utf-8-sig'))['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${VERSION}" >&2
            exit 1
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Laser Finger Joint ${GITHUB_REF_NAME#v}" \
            --generate-notes
